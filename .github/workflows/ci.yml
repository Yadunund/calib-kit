name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          locked: true
      - name: Lint
        run: pixi run lint
      - name: Build
        run: pixi run build
      - name: Test
        run: pixi run test
